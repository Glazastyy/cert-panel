services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zerocert}
      POSTGRES_USER: ${POSTGRES_USER:-zerocert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zerocert_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zerocert} -d ${POSTGRES_DB:-zerocert}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zerocert_postgres_data:
